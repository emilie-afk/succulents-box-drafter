[build]
  publish = "."
  functions = "netlify/functions"

# Keep a nice /api/generate URL for the frontend by redirecting it to the function.
[[redirects]]
  from = "/api/generate"
  to = "/.netlify/functions/generate"
  status = 200
  force = true

[[redirects]]
  from = "/api/session"
  to = "/.netlify/functions/session"
  status = 200
  force = true
